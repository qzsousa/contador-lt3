<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Controle de Impressões + PDF</title>
    <!-- Usando versões mais robustas e com fallback -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; text-align: center; padding: 20px; }
        #cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-bottom: 40px; }
        .card { background: white; padding: 15px; border-radius: 10px; width: 250px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .relatorio-container { background: white; border-radius: 20px; padding: 20px; margin-top: 30px; max-width: 1000px; margin-left: auto; margin-right: auto; }
        .filtro-mes { display: flex; justify-content: center; gap: 15px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
        .btn-pdf { background-color: #2c7da0; color: white; border: none; padding: 10px 20px; border-radius: 30px; cursor: pointer; font-size: 16px; }
        .btn-pdf:hover { background-color: #1f5e7a; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; }
        th { background-color: #2c7da0; color: white; }
        canvas#graficoMensal { max-height: 300px; margin-top: 20px; }
        .erro { color: red; background: #ffe0e0; padding: 10px; border-radius: 8px; margin: 10px; }
    </style>
</head>
<body>

<h1>📊 Controle de Impressões</h1>
<div id="cards">Carregando dados...</div>

<div class="relatorio-container">
    <h2>📆 Relatório Mensal por Impressora</h2>
    <div class="filtro-mes">
        <label>Mês:</label>
        <select id="mesSelector"></select>
        <button class="btn-pdf" id="exportarPDF">📄 Exportar este mês em PDF</button>
    </div>
    <div class="grafico-mensal">
        <canvas id="graficoMensal"></canvas>
    </div>
    <div class="tabela-relatorio">
        <table id="tabelaMensal">
            <thead><tr><th>Impressora</th><th>Consumo no mês</th><th>Cota total</th><th>% da cota</th></tr></thead>
            <tbody><tr><td colspan="4">Selecione um mês</td></tr></tbody>
        </table>
    </div>
</div>

<script>
// Configuração das impressoras
const impressoras = [
    { nome: "CAF", tag: "IMP2", cota: 5000 },
    { nome: "NÚCLEO PED.", tag: "IMP1", cota: 5000 },
    { nome: "CRH", tag: "IMP3", cota: 5000 },
    { nome: "GABINETE", tag: "IMP4", cota: 3000 }
];

let currentRegistros = [];
let currentMeses = [];
let currentMesSelecionado = null;
let graficoMensalInstance = null;

// Função para mostrar erros na tela
function mostrarErro(mensagem) {
    const container = document.getElementById("cards");
    container.innerHTML = `<div class="erro">⚠️ ${mensagem}</div>`;
    console.error(mensagem);
}

// Parse do contador.txt
function parseLinhasContador(linhas) {
    const registros = [];
    for (let linha of linhas) {
        linha = linha.trim();
        if (!linha) continue;
        const partes = linha.split(/\s+/);
        if (partes.length < 4) continue;
        const tag = partes[0];
        const [dia, mes, ano] = partes[1].split('/');
        const valor = parseInt(partes[3]);
        if (isNaN(valor)) continue;
        const dataObj = new Date(parseInt(ano), parseInt(mes)-1, parseInt(dia));
        if (isNaN(dataObj.getTime())) continue;
        registros.push({ tag, dataObj, valor });
    }
    registros.sort((a,b) => a.dataObj - b.dataObj);
    return registros;
}

// Uso total para cards
function calcularUsoTotal(registros, tag) {
    const filtrados = registros.filter(r => r.tag === tag);
    if (filtrados.length < 2) return 0;
    return Math.max(0, filtrados[filtrados.length-1].valor - filtrados[0].valor);
}

// Meses únicos disponíveis
function obterMesesUnicos(registros) {
    const mapa = new Map();
    for (const r of registros) {
        const ano = r.dataObj.getFullYear();
        const mes = r.dataObj.getMonth() + 1;
        const key = `${ano}-${mes}`;
        if (!mapa.has(key)) {
            const nomeMes = r.dataObj.toLocaleString('pt-BR', { month: 'long' });
            const rotulo = `${nomeMes.charAt(0).toUpperCase() + nomeMes.slice(1)} ${ano}`;
            mapa.set(key, { ano, mes, rotulo });
        }
    }
    return Array.from(mapa.values()).sort((a,b) => (a.ano - b.ano) || (a.mes - b.mes));
}

// Consumo em um mês específico
function consumoMensalPorTag(registros, tag, ano, mes) {
    const filtrados = registros.filter(r => r.tag === tag && r.dataObj.getFullYear() === ano && (r.dataObj.getMonth()+1) === mes);
    if (filtrados.length === 0) return 0;
    return Math.max(0, filtrados[filtrados.length-1].valor - filtrados[0].valor);
}

// Atualizar relatório ao mudar o mês
function atualizarRelatorioMensal(mesObj) {
    if (!mesObj || !currentRegistros.length) return;
    currentMesSelecionado = mesObj;
    const { ano, mes, rotulo } = mesObj;
    const dados = impressoras.map(imp => ({
        nome: imp.nome,
        consumo: consumoMensalPorTag(currentRegistros, imp.tag, ano, mes),
        cota: imp.cota
    }));
    // Preenche tabela
    const tbody = document.querySelector("#tabelaMensal tbody");
    tbody.innerHTML = "";
    for (const d of dados) {
        const percent = d.cota > 0 ? ((d.consumo / d.cota) * 100).toFixed(1) : 0;
        const row = tbody.insertRow();
        row.insertCell(0).innerText = d.nome;
        row.insertCell(1).innerText = d.consumo.toLocaleString('pt-BR');
        row.insertCell(2).innerText = d.cota.toLocaleString('pt-BR');
        row.insertCell(3).innerText = `${percent}%`;
    }
    // Atualiza gráfico
    const ctx = document.getElementById('graficoMensal').getContext('2d');
    if (graficoMensalInstance) graficoMensalInstance.destroy();
    graficoMensalInstance = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: dados.map(d => d.nome),
            datasets: [{
                label: `Consumo em ${rotulo}`,
                data: dados.map(d => d.consumo),
                backgroundColor: '#2c7da0'
            }]
        },
        options: { responsive: true, maintainAspectRatio: true, scales: { y: { beginAtZero: true } } }
    });
}

// Popular select de meses
function popularSelectMeses(meses) {
    const select = document.getElementById("mesSelector");
    if (!select) return;
    select.innerHTML = "";
    meses.forEach((m, idx) => {
        const option = document.createElement("option");
        option.value = idx;
        option.textContent = m.rotulo;
        select.appendChild(option);
    });
    if (meses.length) {
        select.selectedIndex = meses.length - 1;
        atualizarRelatorioMensal(meses[select.selectedIndex]);
        select.addEventListener("change", () => {
            const idx = parseInt(select.value);
            if (!isNaN(idx)) atualizarRelatorioMensal(meses[idx]);
        });
    }
}

// Renderizar cards de uso total
function renderCards(registros) {
    const container = document.getElementById("cards");
    container.innerHTML = "";
    for (let i = 0; i < impressoras.length; i++) {
        const imp = impressoras[i];
        const uso = calcularUsoTotal(registros, imp.tag);
        const restante = Math.max(0, imp.cota - uso);
        const perc = imp.cota > 0 ? Math.round((uso / imp.cota) * 100) : 0;
        let alerta = uso >= imp.cota ? "🚨 LIMITE ATINGIDO" : (uso >= imp.cota*0.8 ? "⚠️ Próximo do limite" : "✅ OK");
        const canvasId = `cardChart${i}`;
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
            <h3>${imp.nome}</h3>
            <p>Usado total: <b>${uso.toLocaleString('pt-BR')}</b></p>
            <p>Restante: <b>${restante.toLocaleString('pt-BR')}</b></p>
            <p>Cota: ${imp.cota.toLocaleString('pt-BR')}</p>
            <p>${perc}% da cota</p>
            <p class="alerta">${alerta}</p>
            <canvas id="${canvasId}" width="150" height="150"></canvas>
        `;
        container.appendChild(card);
        new Chart(document.getElementById(canvasId), {
            type: 'doughnut',
            data: { labels: ['Usado', 'Restante'], datasets: [{ data: [uso, restante], backgroundColor: ['#e07a5f', '#81b29a'] }] }
        });
    }
}

// Exportar PDF (captura o relatório mensal)
document.getElementById("exportarPDF").addEventListener("click", async function() {
    const element = document.querySelector(".relatorio-container");
    if (!element) return alert("Elemento do relatório não encontrado.");
    const btn = this;
    const textoOriginal = btn.innerText;
    btn.innerText = "⏳ Gerando PDF...";
    btn.disabled = true;
    try {
        const canvas = await html2canvas(element, { scale: 2, logging: false });
        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const imgWidth = 190;
        const imgHeight = (canvas.height * imgWidth) / canvas.width;
        pdf.addImage(imgData, 'PNG', 10, 10, imgWidth, imgHeight);
        const nomeArquivo = `relatorio_${currentMesSelecionado?.rotulo.replace(/ /g, '_') || 'mensal'}.pdf`;
        pdf.save(nomeArquivo);
    } catch (err) {
        console.error(err);
        alert("Erro ao gerar PDF: " + err.message);
    } finally {
        btn.innerText = textoOriginal;
        btn.disabled = false;
    }
});

// CARREGAR DADOS
fetch("contador.txt")
    .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}: contador.txt não encontrado. Verifique se o arquivo está no mesmo diretório.`);
        return res.text();
    })
    .then(text => {
        const linhas = text.split(/\r?\n/);
        currentRegistros = parseLinhasContador(linhas);
        if (currentRegistros.length === 0) throw new Error("Nenhum registro válido encontrado no contador.txt");
        renderCards(currentRegistros);
        currentMeses = obterMesesUnicos(currentRegistros);
        if (currentMeses.length) {
            popularSelectMeses(currentMeses);
        } else {
            document.querySelector("#tabelaMensal tbody").innerHTML = '<tr><td colspan="4">Nenhum mês identificado nos dados</td></tr>';
        }
    })
    .catch(err => {
        mostrarErro(err.message);
        // Mesmo com erro, o botão de PDF continua visível, mas não vai gerar dados válidos
        document.querySelector("#tabelaMensal tbody").innerHTML = `<tr><td colspan="4">Erro ao carregar dados: ${err.message}</td></tr>`;
    });
</script>
</body>
</html>
